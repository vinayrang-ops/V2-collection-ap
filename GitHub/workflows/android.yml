name: Build V2 Collection APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create project files
        run: |
          mkdir -p app/src/main/java/com/v2collection/app
          mkdir -p app/src/main/res/values

          cat << 'EOF' > settings.gradle.kts
          rootProject.name = "V2Collection"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.v2collection.app"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.v2collection.app"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="V2 Collection"
                  android:theme="@style/Theme.Material3.DayNight.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">V2 Collection</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/java/com/v2collection/app/MainActivity.kt
          package com.v2collection.app

          import android.content.Intent
          import android.graphics.Color
          import android.os.Bundle
          import android.view.Gravity
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          class MainActivity : AppCompatActivity() {

              private var totalSales = 0.0
              private var totalExpense = 0.0

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val prefs = getSharedPreferences("v2_ledger_prefs", MODE_PRIVATE)
                  totalSales = prefs.getFloat("sales", 0f).toDouble()
                  totalExpense = prefs.getFloat("expense", 0f).toDouble()

                  val scrollView = ScrollView(this).apply {
                      setBackgroundColor(Color.parseColor("#F5F7FA"))
                  }

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(40, 48, 40, 64)
                  }

                  val titleView = TextView(this).apply {
                      text = "V2 Collection - Angadi Lekka"
                      textSize = 24f
                      setTextColor(Color.parseColor("#111827"))
                      gravity = Gravity.CENTER
                      setPadding(0, 0, 0, 24)
                  }

                  val summaryView = TextView(this).apply {
                      textSize = 18f
                      setTextColor(Color.parseColor("#1F2937"))
                      setBackgroundColor(Color.WHITE)
                      setPadding(32, 32, 32, 32)
                  }

                  val amountInput = EditText(this).apply {
                      hint = "Amount (Rs.) haaki"
                      inputType = android.text.InputType.TYPE_CLASS_NUMBER or android.text.InputType.TYPE_NUMBER_FLAG_DECIMAL
                      setBackgroundColor(Color.WHITE)
                      setPadding(28, 24, 28, 24)
                  }

                  val addSaleBtn = Button(this).apply {
                      text = "+ Add Sale (Marata)"
                      setBackgroundColor(Color.parseColor("#16A34A"))
                      setTextColor(Color.WHITE)
                  }

                  val addExpenseBtn = Button(this).apply {
                      text = "- Add Expense (Kharchu)"
                      setBackgroundColor(Color.parseColor("#DC2626"))
                      setTextColor(Color.WHITE)
                  }

                  val whatsappBtn = Button(this).apply {
                      text = "Share Report on WhatsApp"
                      setBackgroundColor(Color.parseColor("#25D366"))
                      setTextColor(Color.WHITE)
                  }

                  val resetBtn = Button(this).apply {
                      text = "Reset Day Lekka"
                      setBackgroundColor(Color.parseColor("#4B5563"))
                      setTextColor(Color.WHITE)
                  }

                  fun refreshSummary() {
                      val net = totalSales - totalExpense
                      summaryView.text = "Sales: ₹" + "%.2f".format(totalSales) +
                          "\nExpense: ₹" + "%.2f".format(totalExpense) +
                          "\nNet Balance: ₹" + "%.2f".format(net)
                      prefs.edit()
                          .putFloat("sales", totalSales.toFloat())
                          .putFloat("expense", totalExpense.toFloat())
                          .apply()
                  }

                  addSaleBtn.setOnClickListener {
                      val amt = amountInput.text.toString().toDoubleOrNull()
                      if (amt != null && amt > 0) {
                          totalSales += amt
                          amountInput.text.clear()
                          refreshSummary()
                      } else {
                          Toast.makeText(this, "Sariyaada amount haaki", Toast.LENGTH_SHORT).show()
                      }
                  }

                  addExpenseBtn.setOnClickListener {
                      val amt = amountInput.text.toString().toDoubleOrNull()
                      if (amt != null && amt > 0) {
                          totalExpense += amt
                          amountInput.text.clear()
                          refreshSummary()
                      } else {
                          Toast.makeText(this, "Sariyaada amount haaki", Toast.LENGTH_SHORT).show()
                      }
                  }

                  whatsappBtn.setOnClickListener {
                      val dateStr = SimpleDateFormat("dd-MM-yyyy", Locale.getDefault()).format(Date())
                      val net = totalSales - totalExpense
                      val msg = "*V2 Collection Daily Report ($dateStr)*\n" +
                          "Sales: ₹" + "%.2f".format(totalSales) +
                          "\nExpense: ₹" + "%.2f".format(totalExpense) +
                          "\nNet Balance: ₹" + "%.2f".format(net)

                      val intent = Intent(Intent.ACTION_SEND).apply {
                          type = "text/plain"
                          putExtra(Intent.EXTRA_TEXT, msg)
                      }
                      startActivity(Intent.createChooser(intent, "Share Report"))
                  }

                  resetBtn.setOnClickListener {
                      totalSales = 0.0
                      totalExpense = 0.0
                      refreshSummary()
                      Toast.makeText(this, "Lekka reset aagide", Toast.LENGTH_SHORT).show()
                  }

                  refreshSummary()

                  val gap = { LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 24) }

                  root.addView(titleView)
                  root.addView(summaryView)
                  root.addView(TextView(this), gap())
                  root.addView(amountInput)
                  root.addView(TextView(this), gap())
                  root.addView(addSaleBtn)
                  root.addView(TextView(this), gap())
                  root.addView(addExpenseBtn)
                  root.addView(TextView(this), gap())
                  root.addView(whatsappBtn)
                  root.addView(TextView(this), gap())
                  root.addView(resetBtn)

                  scrollView.addView(root)
                  setContentView(scrollView)
              }
          }
          EOF

      - name: Setup Gradle Wrapper
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: V2-Collection-APK
          path: app/build/outputs/apk/debug/app-debug.apk
